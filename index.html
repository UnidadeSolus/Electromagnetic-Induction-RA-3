<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Realidade Aumentada - IFRJ</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <a-scene
    mindar-image="imageTargetSrc: https://raw.githubusercontent.com/UnidadeSolus/Electromagnetic-Induction-RA-3/main/IFRJ.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img
        id="card"
        src="https://raw.githubusercontent.com/UnidadeSolus/Electromagnetic-Induction-RA-3/main/IFRJ.png"
        crossorigin="anonymous" />

      <a-asset-item
        id="magneticFieldModel"
        src="https://raw.githubusercontent.com/UnidadeSolus/Electromagnetic-Induction-RA-3/main/Electromagnetic-Induction-3D.glb">
      </a-asset-item>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <!-- Imagem de referência IFRJ -->
      <a-plane
        src="#card"
        position="0 0 0"
        height="0.552"
        width="1"
        rotation="0 0 0">
      </a-plane>

      <!-- Modelo GLB: escala aumentada em relação ao modelo de demonstração -->
      <a-gltf-model
        id="magneticField"
        src="#magneticFieldModel"
        position="0 0 0.12"
        rotation="0 0 0"
        scale="0.15 0.15 0.15">
      </a-gltf-model>
    </a-entity>

  </a-scene>
</body>
</html>
